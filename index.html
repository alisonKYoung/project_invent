<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gas Sensor Reading</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
</head>
<body>
    <button id="connectButton">Connect to handle</button>
    <label for="sensorDropdown">Select a sensor: </label>
    <select id="sensorDropdown">
        <option value="mq3\n">MQ3</option>
        <option value="mq4\n">MQ4</option>
    </select>
    <button id="selectButton">Switch to selected sensor</button>
    <button id="readButton">Start reading data</button>
    <button id="disconnectButton">Disconnect</button>
    <button id="resetChart">Reset graph</button>
    <pre id="kekw">Click "Connect to handle" button first</pre>
    <canvas id="gasChart" style="width:100%;max-width:600px;"></canvas>
    <script src="webserial.js"></script>
</body>
</html>
